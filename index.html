<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rifah's Kaleidoscope — Stock & Delivery Tracker</title>
<style>
:root{--bg:#faf6f1;--card:#fff;--tx:#2a2230;--mu:#7a6f80;--bd:#eadfd6;--ac:#9b2d6f;--ac2:#f5e1ee;--ok:#2e7d5b;--wn:#b86e00;--er:#b3382f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17131b;--card:#221c28;--tx:#f0e9f3;--mu:#a99cb0;--bd:#372e3f;--ac:#e07ab8;--ac2:#3a2334;--ok:#5fc496;--wn:#e8a23c;--er:#f0857b}}
:root[data-theme="dark"]{--bg:#17131b;--card:#221c28;--tx:#f0e9f3;--mu:#a99cb0;--bd:#372e3f;--ac:#e07ab8;--ac2:#3a2334;--ok:#5fc496;--wn:#e8a23c;--er:#f0857b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
header b{color:var(--ac);white-space:nowrap}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0}
nav a{padding:6px 12px;border-radius:99px;cursor:pointer;white-space:nowrap;color:var(--mu)}
nav a.on{background:var(--ac2);color:var(--ac);font-weight:600}
main{max-width:1150px;margin:0 auto;padding:16px}
h2{margin:0 12px 0 0;font-size:20px}
button{font:inherit;padding:7px 14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;cursor:pointer}
button.pr{background:var(--ac);border-color:var(--ac);color:#fff}
button.gh{border:0;background:none;color:var(--mu)}
button.dg{color:var(--er)}
input,select,textarea{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.tb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tb input{flex:1;min-width:140px;width:auto}
.w{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
th{color:var(--mu);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--ac2)}
.em{padding:28px;text-align:center;color:var(--mu)}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.k .card small{color:var(--mu)}.k .card div{font-size:24px;font-weight:700;color:var(--ac)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px}
.br{display:grid;grid-template-columns:120px 1fr 34px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.br span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br i{height:10px;background:var(--ac2);border-radius:9px;overflow:hidden}
.br u{display:block;height:100%;background:var(--ac);border-radius:9px}
.br b{text-align:right}
.b{padding:2px 9px;border-radius:99px;font-size:12px;background:var(--ac2);color:var(--ac)}
.s0{color:var(--wn)}.s4{color:var(--ok)}.s5{color:var(--er)}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(620px,94vw);padding:18px;max-height:88vh;overflow-y:auto}
.itemcard{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--bg)}
.itemcard .g{grid-template-columns:1fr 1fr;margin:0 0 8px}
dialog::backdrop{background:#0007}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.g label{font-size:12px;color:var(--mu);display:block}.g .f{grid-column:1/-1}
.r{display:flex;gap:8px;justify-content:flex-end}.r .sp{margin-right:auto}
.lg{min-height:80vh;display:grid;place-items:center;padding:16px}
.lg .card{width:min(380px,100%);display:grid;gap:10px}
.lg h1{margin:0;color:var(--ac);font-size:24px}.lg p{margin:0;color:var(--mu)}
.er{color:var(--er);min-height:1.2em;font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
#toast.on{opacity:1}
.set{display:grid;gap:12px;max-width:560px}.set p{color:var(--mu);margin:0 0 8px}
@media(max-width:560px){.g{grid-template-columns:1fr}}
.hb{display:none;border:0;background:none;font-size:20px;line-height:1;color:var(--tx);cursor:pointer;padding:2px 8px;border-radius:6px}
@media(max-width:640px){
.hb{display:inline-block}
nav{display:none;order:10;flex-basis:100%;flex-direction:column;align-items:stretch;overflow-x:visible;gap:3px;margin-top:8px}
nav.open{display:flex}
nav a{width:100%;padding:9px 12px}
}
@media(max-width:480px){
header{padding:8px 10px;gap:6px}
header b{font-size:14px}
nav a{padding:5px 9px;font-size:13px}
header small{display:none}
.k{grid-template-columns:repeat(2,1fr);gap:8px}
.k .card{padding:10px}.k .card div{font-size:19px}
.br{grid-template-columns:78px 1fr 28px;font-size:12px}
th,td{padding:7px 8px;font-size:12.5px;max-width:150px}
.r{flex-wrap:wrap}
.tb{gap:6px}.tb input{min-width:0}
}
.r{flex-wrap:wrap}
</style></head>
<body>
<div id="app"></div><dialog id="dlg"></dialog><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===== SETUP: paste the two values from Supabase (Project Settings → API) ===== */
const SB={url:'https://jeyyeqvexpzoylsrdlmk.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpleXllcXZleHB6b3lsc3JkbG1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1Njk0NTAsImV4cCI6MjEwNjE0NTQ1MH0.a5YtjwWX1D6-Cw8q9PAo0GOxYu6sj41rwNWyv2emh70'};
/* ================================================================================ */
const $=(s,e=document)=>e.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),
uid=()=>Math.random().toString(36).slice(2,9),today=()=>new Date().toISOString().slice(0,10),
SZ=['XS','S','M','L','XL','XXL','XXXL','Free Size','Custom'],ST=['Unstitched','Stitched','Stitched Without Pant & Duppatta'],
DS=['Pending','Packed','Dispatched','Out for Delivery','Delivered','Returned'],
G='in gate',H='Rifah Mam from house',dt=n=>n?new Date(Date.UTC(1899,11,30)+n*864e5).toISOString().slice(0,10):'';
let D,me,sb,cur='dash',Q={},navOpen=false;
const pr=n=>(D.stock.find(s=>s.name===n)||{}).price||0;
const M={
stock:{t:'Stock List',f:[['name','Stock Name','text'],['coll','Collection','text'],['price','Price (Rs.)','number'],['ref','Ref / Description','text']]},
reg:{t:'Stock Register',f:[['date','Date','date'],['name','Stock Name','text','stocks'],['stitch','Stitch Type','text','stitch'],['size','Size','text','sizes'],['from','Received From','text'],['to','Delivered To','text'],['dd','Date Delivered','date'],['in','Qty In','number'],['out','Qty Out','number']],x:['Holding',r=>(+r.in||0)-(+r.out||0)]},
asg:{t:'Delivery Assignment',f:[['date','Date','date'],['cust','Customer Name','text'],['name','Stock Name','text','stocks'],['stitch','Stitch Type','text','stitch'],['size','Size','text','sizes'],['qty','Qty','number'],['notes','Notes','text']],x:['Amount (Rs.)',r=>(+r.qty||0)*pr(r.name)]},
del:{t:'Delivery Details',f:[['date','Date','date'],['cust','Customer Name','text'],['phone','Phone Number','tel'],['addr','Delivery Address','textarea'],['track','Courier / Tracking No.','text'],['disp','Dispatch Date','date'],['exp','Expected Delivery','date'],['status','Status','select'],['on','Delivered On','date']]}};
const N=[['dash','Dashboard'],['stock','Stock List'],['reg','Stock Register'],['asg','Assignments'],['del','Deliveries'],['set','Settings']];

function seed(){
const S=[['Indigo Bloom',2950,'Dark blue with floral'],['Gul-E-Aasman',2950,'powder blue and blush pink'],['Gulmohar Pink',2950,'Hand-block inspired floral print with white duppata'],['Nizhal Verse',2950,'geometric grid-print kurta, Bold striped dupatta'],['Jamuni Jharokha',2950,'lavender cotton kurta with buti prints'],['Aira Floral Set',2950,'pink & aqua floral motifs'],['Kanchan Mavi',2999,'Soft olive green floral print'],['Mehroom Mocha',2950,'mehroon-brown palette with delicate botanical motifs'],['Bindi and Borders',2950,'Dots with maroon borders'],['Monochrome Mehfil',2950,'Duppatta With Peacock'],['Monochrome Muse',2950,'Duppatta With Peacock'],['Mosaic Set',3100,'Black, muted peach, red & warm orange'],['Ruhani Rouge',2950,'Red and black with red pant'],['Sky Loom',2950,'bold polka dots, vibrant turquoise blue box with curved neck'],['Sunheri Dori',2950,'floral motifs,yellow border, with green top'],['Wishpers Of Blue',2950,'powder blue cotton kurta, with off white duppatta & pant'],['Ziya Plum Set',2950,'cut-out neckline, with dark wine colour of 3 set']];
const s='Stitched',R=[[46286,'Indigo Bloom','Unstitched','Custom',H,H,46288,11,11],[46286,'Indigo Bloom',s,'M',H,H,46290,1,''],[46288,'Gulmohar Pink',s,'Custom',G,H,46290,1,''],[46288,'Unknown',s,'L',G,H,46290,1,''],[46290,'Gul-E-Aasman',s,'M',G,H,46290,1,''],[46290,'Mehroom Mocha',s,'XL',G,H,46290,1,''],[46290,'Unknown',s,'M',G,H,46290,1,''],[46290,'Indigo Bloom',s,'L',G,H,46290,1,''],[46290,'Mehroom Muse','Stitched Without Pant & Duppatta','XL',G,H,46290,1,''],[46290,'Mehroom Mocha',s,'M',G,H,46290,1,''],[46290,'Gul-E-Aasman',s,'Custom',G,'TO HOUSE',46290,1,''],[46293,'Monochrome Mehfil',s,'L',G,'','',1,''],[46293,'Sunheri Dori',s,'XXL',G,'','',1,''],[46293,'Sunheri Dori',s,'M',G,'','',1,''],[46293,'Bindi and Borders',s,'XXXL',G,'','',1,''],[46293,'Nizhal Verse',s,'XXXL',G,'','',1,''],[46293,'Pottery Dream Cotton',s,'46',G,'','',1,'']];
const A=[['Thevar Sneha','Unstitched','Custom'],['Sivaranjani Rajendran',s,'S'],['Jhanvi Chitturi',s,'L'],['Shyamala Garnepudi',s,'S']];
return{stock:S.map(([name,price,ref])=>({id:uid(),name,coll:'KOTA DORIYA',price,ref})),
reg:R.map(a=>({id:uid(),date:dt(a[0]),name:a[1],stitch:a[2],size:a[3],from:a[4],to:a[5],dd:dt(a[6]),in:a[7],out:a[8]})),
asg:A.map(a=>({id:uid(),date:dt(46287),cust:a[0],items:[{name:'Gul-E-Aasman',stitch:a[1],size:a[2],qty:1,notes:'Completed'}]})),del:[]}}
function migrateAsg(){let ch=false;D.asg=D.asg.map(r=>{if(r.items)return r;ch=true;return{id:r.id,date:r.date,cust:r.cust,items:[{name:r.name||'',stitch:r.stitch||'',size:r.size||'',qty:r.qty||1,notes:r.notes||''}],by:r.by,at:r.at}});return ch}

/* ---------- storage (Supabase table "kv") ---------- */
async function load(k){const{data,error}=await sb.from('kv').select('j').eq('k',k).maybeSingle();if(error)throw error;return data?JSON.parse(data.j):null}
async function save(k,o){const{error}=await sb.from('kv').upsert({k,j:JSON.stringify(o)});toast(error?'Save failed: '+error.message:'Saved')}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)}
const persist=()=>save('data',D);
async function mut(fn){try{const L=await load('data');if(L)D=L}catch(e){}fn();await persist()} // re-read latest so two staff saving at once don't overwrite each other

/* ---------- login (Supabase Auth: one account per staff member) ---------- */
const mk=u=>({id:u.id,name:(u.user_metadata&&u.user_metadata.name)||u.email,role:u.app_metadata&&u.app_metadata.role==='admin'?'admin':'staff'});
function loginView(){$('#app').innerHTML=`<div class="lg"><div class="card"><h1>🧵 Rifah's Kaleidoscope</h1><p>Sign in to your stock & delivery tracker.</p><input id="u" type="email" placeholder="Email" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password"><div class="er" id="er"></div><button class="pr" id="go">Sign in</button></div></div>`;
 $('#go').onclick=doAuth;document.querySelectorAll('.lg input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')doAuth()});$('#u').focus()}
async function doAuth(){const{data,error}=await sb.auth.signInWithPassword({email:$('#u').value.trim(),password:$('#p').value});if(error)return $('#er').textContent='Wrong email or password.';await start(data.user)}
async function start(u){me=mk(u);
 try{D=await load('data');if(!D){D=seed();await save('data',D)}else if(migrateAsg())await save('data',D)}
 catch(e){$('#app').innerHTML='<div class="lg"><div class="card"><h1>Couldn’t reach the database</h1><p>Nothing was changed. Check your internet and the setup steps in the README, then retry.</p><button class="pr" onclick="location.reload()">Retry</button></div></div>';return}
 go('dash')}
async function logout(){await sb.auth.signOut();me=null;loginView()} // data stays in the database

/* ---------- views ---------- */
function go(v){cur=v;draw()}
function theme(){const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'}
function draw(){
 const opts=a=>a.map(x=>`<option value="${esc(x)}">`).join(''),
 stocks=[...new Set(D.stock.map(s=>s.name))],sizes=[...new Set([...SZ,...D.reg.map(r=>r.size),...D.asg.map(r=>r.size)].filter(Boolean))];
 $('#app').innerHTML=`<header><b>🧵 Rifah's Kaleidoscope</b><button class="hb" onclick="navOpen=!navOpen;draw()" aria-label="Menu">☰</button><nav id="mnav" class="${navOpen?'open':''}">${N.filter(([k])=>k!=='staff'||me.role==='admin').map(([k,l])=>`<a class="${k===cur?'on':''}" onclick="navOpen=false;go('${k}')">${l}</a>`).join('')}</nav><small style="color:var(--mu)">${esc(me.name)} · ${me.role}</small><button class="gh" onclick="theme()" title="Light / dark">◐</button><button class="gh" onclick="logout()">Log out</button></header><main>${cur==='dash'?dash():cur==='set'?sett():list(cur)}</main><datalist id="stocks">${opts(stocks)}</datalist><datalist id="stitch">${opts(ST)}</datalist><datalist id="sizes">${opts(sizes)}</datalist>`}
function dash(){
 const sm=(a,k)=>a.reduce((t,r)=>t+(+r[k]||0),0),tin=sm(D.reg,'in'),tout=sm(D.reg,'out'),
 open=D.del.filter(r=>!['Delivered','Returned'].includes(r.status)),od=open.filter(r=>r.exp&&r.exp<today()),by={};
 D.reg.forEach(r=>by[r.name]=(by[r.name]||0)+(+r.in||0)-(+r.out||0));
 const top=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,8),mx=Math.max(1,...top.map(t=>t[1])),
 cnt=DS.map(s=>[s,D.del.filter(r=>r.status===s).length]),cm=Math.max(1,...cnt.map(c=>c[1])),
 asgIt=D.asg.flatMap(r=>r.items||[]),unitsAsg=asgIt.reduce((t,it)=>t+(+it.qty||0),0),val=asgIt.reduce((t,it)=>t+(+it.qty||0)*pr(it.name),0),
 K=[['Designs in catalogue',D.stock.length],['Units in holding',tin-tout],['Units received',tin],['Units sent out',tout],['Units assigned',unitsAsg],['Assigned value','Rs. '+val.toLocaleString('en-IN')],['Open deliveries',open.length],['Overdue deliveries',od.length]],
 bar=(l,v,m)=>`<div class="br"><span title="${esc(l)}">${esc(l)}</span><i><u style="width:${Math.max(0,v)/m*100}%"></u></i><b>${v}</b></div>`,
 rec=[...D.reg].sort((a,b)=>(b.date||'')<(a.date||'')?-1:1).slice(0,5);
 return`<div class="k">${K.map(([l,v])=>`<div class="card"><small>${l}</small><div>${v}</div></div>`).join('')}</div>
<div class="two"><div class="card"><h3>Holding by design</h3>${top.length?top.map(t=>bar(t[0],t[1],mx)).join(''):'<div class="em">No register entries yet</div>'}</div>
<div class="card"><h3>Deliveries by status</h3>${cnt.map(c=>bar(c[0],c[1],cm)).join('')}</div></div>
<div class="two"><div class="card"><h3>⚠ Overdue deliveries</h3>${od.length?od.map(r=>`<div>${esc(r.cust)} — due ${esc(r.exp)} <span class="b s0">${esc(r.status)}</span></div>`).join(''):'<div class="em">Nothing overdue 🎉</div>'}</div>
<div class="card"><h3>Latest register entries</h3>${rec.map(r=>`<div>${esc(r.date)} · ${esc(r.name)} · ${esc(r.size)} · ${esc(r.stitch)}</div>`).join('')||'<div class="em">Empty</div>'}</div></div>`}
function list(m){const c=M[m];
 return`<div class="tb"><h2>${c.t}</h2><input id="q" placeholder="Search…" value="${esc(Q[m]||'')}" oninput="Q['${m}']=this.value;$('#tb').innerHTML=tbl('${m}')"><button class="pr" onclick="${m==='asg'?'asgEdit()':`edit('${m}')`}">+ Add</button><button onclick="csv('${m}')">Export CSV</button></div><div class="w" id="tb">${tbl(m)}</div>`}
function tbl(m){if(m==='asg')return asgTbl();const c=M[m],q=(Q[m]||'').toLowerCase(),hasD=c.f[0][2]==='date',
 rows=D[m].filter(r=>!q||Object.values(r).join(' ').toLowerCase().includes(q)).sort((a,b)=>hasD?((b.date||'')<(a.date||'')?-1:1):String(a.name).localeCompare(b.name));
 if(!rows.length)return`<div class="em">${D[m].length?'No matches.':'Nothing here yet — click “+ Add”.'}</div>`;
 return`<table><thead><tr>${c.f.map(f=>`<th>${f[1]}</th>`).join('')}${c.x?`<th>${c.x[0]}</th>`:''}</tr></thead><tbody>${rows.map(r=>`<tr onclick="edit('${m}','${r.id}')">${c.f.map(([k])=>`<td>${k==='status'&&r[k]?`<span class="b s${DS.indexOf(r[k])}">${esc(r[k])}</span>`:esc(r[k])}</td>`).join('')}${c.x?`<td><b>${c.x[1](r)}</b></td>`:''}</tr>`).join('')}</tbody></table>`}
function edit(m,id){const c=M[m],r=id?D[m].find(x=>x.id===id):{date:today(),qty:1,in:1,status:'Pending',coll:'KOTA DORIYA'};
 $('#dlg').innerHTML=`<h3 style="margin:0">${id?'Edit':'Add'} · ${c.t}</h3><div class="g">${c.f.map(([k,l,t,dl])=>`<div class="${t==='textarea'||k==='ref'||k==='addr'?'f':''}"><label>${l}</label>${t==='select'?`<select id="f_${k}">${DS.map(o=>`<option${o===r[k]?' selected':''}>${o}</option>`).join('')}</select>`:t==='textarea'?`<textarea id="f_${k}" rows="2">${esc(r[k])}</textarea>`:`<input id="f_${k}" type="${t}" value="${esc(r[k])}"${dl?` list="${dl}"`:''}>`}</div>`).join('')}</div>${r.by?`<p style="font-size:12px;color:var(--mu);margin:0 0 10px">Last saved by ${esc(r.by)} · ${esc(r.at)}</p>`:''}<div class="r">${id&&me.role==='admin'?'<button class="dg sp" id="dx">Delete</button>':''}<button onclick="$(\'#dlg\').close()">Cancel</button><button class="pr" onclick="sv('${m}','${id||''}')">Save</button></div>`;
 if($('#dx'))$('#dx').onclick=async e=>{if(!e.target.dataset.c){e.target.dataset.c=1;e.target.textContent='Click again to delete';return}
  await mut(()=>{D[m]=D[m].filter(x=>x.id!==id)});$('#dlg').close();draw()};
 $('#dlg').showModal()}
async function sv(m,id){const c=M[m],v={};
 c.f.forEach(([k,,t])=>{const x=$('#f_'+k).value.trim();v[k]=t==='number'?(x===''?'':+x):x});
 if(!(v.name||v.cust))return toast('Please fill in the name');
 v.by=me.name;v.at=today();
 await mut(()=>{const r=id&&D[m].find(x=>x.id===id);if(r)Object.assign(r,v);else D[m].push({id:id||uid(),...v})});
 $('#dlg').close();draw()}
function asgTotal(items){return items.reduce((t,it)=>t+(+it.qty||0)*pr(it.name),0)}
function asgTbl(){const q=(Q.asg||'').toLowerCase();
 let rows=D.asg.filter(r=>!q||(r.cust+' '+r.date+' '+(r.items||[]).map(it=>it.name+' '+it.stitch+' '+it.size+' '+it.notes).join(' ')).toLowerCase().includes(q));
 rows=[...rows].sort((a,b)=>(b.date||'')<(a.date||'')?-1:1);
 if(!rows.length)return`<div class="em">${D.asg.length?'No matches.':'Nothing here yet — click “+ Add”.'}</div>`;
 return`<table><thead><tr><th>Date</th><th>Customer</th><th>Items</th><th>Total Qty</th><th>Amount (Rs.)</th></tr></thead><tbody>${rows.map(r=>{const items=r.items||[],qty=items.reduce((t,it)=>t+(+it.qty||0),0),amt=asgTotal(items),summary=items.map(it=>`${esc(it.name)}${it.size?' ('+esc(it.size)+')':''} ×${it.qty}`).join(', ');return`<tr onclick="asgEdit('${r.id}')"><td>${esc(r.date)}</td><td>${esc(r.cust)}</td><td>${summary}</td><td>${qty}</td><td><b>${amt.toLocaleString('en-IN')}</b></td></tr>`}).join('')}</tbody></table>`}
let draftItems=[];
function blankItem(){return{name:'',stitch:'',size:'',qty:1,notes:''}}
function asgEdit(id){const r=id?D.asg.find(x=>x.id===id):{date:today(),cust:''};
 draftItems=id?r.items.map(x=>({...x})):[blankItem()];
 $('#dlg').innerHTML=asgForm(r,id);
 if($('#adx'))$('#adx').onclick=async e=>{if(!e.target.dataset.c){e.target.dataset.c=1;e.target.textContent='Click again to delete';return}
  await mut(()=>{D.asg=D.asg.filter(x=>x.id!==id)});$('#dlg').close();draw()};
 $('#dlg').showModal()}
function itemRow(it,i){return`<div class="itemcard"><div class="g"><div><label>Stock Name</label><input value="${esc(it.name)}" list="stocks" oninput="draftItems[${i}].name=this.value;updTotal()"></div><div><label>Stitch Type</label><input value="${esc(it.stitch)}" list="stitch" oninput="draftItems[${i}].stitch=this.value"></div><div><label>Size</label><input value="${esc(it.size)}" list="sizes" oninput="draftItems[${i}].size=this.value"></div><div><label>Qty</label><input type="number" min="1" value="${it.qty}" oninput="draftItems[${i}].qty=+this.value||0;updTotal()"></div><div class="f"><label>Notes</label><input value="${esc(it.notes)}" oninput="draftItems[${i}].notes=this.value"></div></div><button type="button" class="dg gh" style="padding:2px 4px" onclick="rmItem(${i})">✕ Remove this item</button></div>`}
function asgForm(r,id){return`<h3 style="margin:0 0 4px">${id?'Edit':'Add'} · Delivery Assignment</h3><p style="color:var(--mu);margin:0 0 10px;font-size:13px">One customer, one or more stock items.</p>
<div class="g"><div><label>Date</label><input id="af_date" type="date" value="${esc(r.date||today())}"></div><div><label>Customer Name</label><input id="af_cust" value="${esc(r.cust||'')}"></div></div>
<div id="items">${draftItems.map((it,i)=>itemRow(it,i)).join('')}</div>
<button type="button" onclick="addItem()">+ Add another stock item</button>
<div id="asgTotalLine" style="text-align:right;margin-top:10px;font-weight:600">Total: Rs. ${asgTotal(draftItems).toLocaleString('en-IN')}</div>
${r.by?`<p style="font-size:12px;color:var(--mu);margin:8px 0 0">Last saved by ${esc(r.by)} · ${esc(r.at)}</p>`:''}
<div class="r" style="margin-top:12px">${id&&me.role==='admin'?'<button class="dg sp" id="adx">Delete</button>':''}<button onclick="$(\'#dlg\').close()">Cancel</button><button class="pr" onclick="asgSave(\'${id||''}\')">Save</button></div>`}
function addItem(){draftItems.push(blankItem());refreshItems()}
function rmItem(i){draftItems.splice(i,1);if(!draftItems.length)draftItems.push(blankItem());refreshItems()}
function refreshItems(){$('#items').innerHTML=draftItems.map((it,i)=>itemRow(it,i)).join('');updTotal()}
function updTotal(){const t=$('#asgTotalLine');if(t)t.textContent='Total: Rs. '+asgTotal(draftItems).toLocaleString('en-IN')}
async function asgSave(id){const date=$('#af_date').value,cust=$('#af_cust').value.trim();
 if(!cust)return toast('Please enter the customer name');
 const items=draftItems.filter(it=>it.name.trim());
 if(!items.length)return toast('Add at least one stock item');
 const v={date,cust,items,by:me.name,at:today()};
 await mut(()=>{const r=id&&D.asg.find(x=>x.id===id);if(r)Object.assign(r,v);else D.asg.push({id:id||uid(),...v})});
 $('#dlg').close();draw()}
function sett(){return`<div class="set"><h2>Settings</h2>
<div class="card"><h3>Data storage</h3><p>✅ Data is saved in your Supabase database. It stays put when you log out, refresh, or open the site on another device.</p>${me.role==='admin'?'<button onclick="backup()">Download full backup (.json)</button> <button onclick="$(\'#rf\').click()">Restore from backup</button><input id="rf" type="file" accept=".json" hidden onchange="restore(this)">':''}</div>
<div class="card"><h3>Change my password</h3><input id="np" type="password" placeholder="New password (6+ characters)"><br><br><button onclick="chpw()">Update password</button></div></div>`}
function dl(name,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e3)}
function csv(m){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 if(m==='asg'){const rows=[['Date','Customer Name','Stock Name','Stitch Type','Size','Qty','Notes','Amount (Rs.)']];D.asg.forEach(r=>(r.items||[]).forEach(it=>rows.push([r.date,r.cust,it.name,it.stitch,it.size,it.qty,it.notes,(+it.qty||0)*pr(it.name)])));return dl('asg.csv',rows.map(r=>r.map(q).join(',')).join('\n'))}
 const c=M[m];dl(m+'.csv',[c.f.map(f=>f[1]),...D[m].map(r=>c.f.map(f=>r[f[0]]))].map(r=>r.map(q).join(',')).join('\n'))}
const backup=()=>dl('rifahs-backup-'+today()+'.json',JSON.stringify(D,null,1));
function restore(i){const f=i.files[0];if(!f)return;const rd=new FileReader();rd.onload=async()=>{try{const o=JSON.parse(rd.result);if(!['stock','reg','asg','del'].every(k=>Array.isArray(o[k])))throw 0;D=o;await persist();toast('Backup restored');draw()}catch(e){toast('That file is not a valid backup')}};rd.readAsText(f)}
async function chpw(){const p=$('#np').value;if(p.length<6)return toast('Use at least 6 characters');const{error}=await sb.auth.updateUser({password:p});toast(error?error.message:'Password updated');$('#np').value=''}
/* ---------- start ---------- */
(async function boot(){
 $('#app').innerHTML='<div class="lg">Loading…</div>';
 try{if(!window.supabase||SB.url.startsWith('PASTE'))throw 0;
  sb=supabase.createClient(SB.url,SB.key);
  const{data:{session}}=await sb.auth.getSession();session?await start(session.user):loginView();
  document.addEventListener('visibilitychange',async()=>{if(document.hidden||!me||$('#dlg').open)return;try{D=await load('data');draw()}catch(e){}})
 }catch(e){$('#app').innerHTML='<div class="lg"><div class="card"><h1>Setup needed</h1><p>Open index.html and paste your Supabase URL and anon key at the top of the script. See README.md.</p></div></div>'}
})();
</script></body></html>
