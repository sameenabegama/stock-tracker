<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rifah's Kaleidoscope — Stock and deliveries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
/* ---- Colours: change these few values to re-theme the whole site ---- */
:root{color-scheme:light;
--bg:#f3f4f8;--sf:#ffffff;--sf2:#f8f9fc;--ln:#e3e6f0;
--ink:#171c36;--ink2:#4a5073;--ink3:#7a80a0;
--br:#2b3a8f;--br2:#222f78;--brt:#ffffff;--br50:#eceffc;--br100:#d8defa;--ring:rgba(43,58,143,.22);
--ok:#1b7f55;--okb:#e1f4ea;--wn:#96600a;--wnb:#fdf1d6;--er:#c2344c;--erb:#fce6ea;
--in:#2a5cb0;--inb:#e4edfb;--vi:#6a3db3;--vib:#eee8fa;
--side:#1a2150;--sideink:#eef0fb;--sidemu:#a9b0dc;
--serif:'Young Serif',Georgia,'Times New Roman',serif;
--sans:Figtree,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
--r:14px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
--bg:#0e1124;--sf:#161a33;--sf2:#1b2040;--ln:#272d52;--ink:#eceefb;--ink2:#b0b6dc;--ink3:#7f86b0;
--br:#8fa0ff;--br2:#a6b3ff;--brt:#0e1124;--br50:#1e2550;--br100:#2b3466;--ring:rgba(143,160,255,.3);
--ok:#58c995;--okb:#143427;--wn:#e8b54e;--wnb:#3a2d10;--er:#ff7d92;--erb:#411a24;
--in:#86adff;--inb:#17284d;--vi:#b79cff;--vib:#2b1f4f;--side:#0a0d1e;--sideink:#eceefb;--sidemu:#8890bd}}
:root[data-theme="dark"]{color-scheme:dark;
--bg:#0e1124;--sf:#161a33;--sf2:#1b2040;--ln:#272d52;--ink:#eceefb;--ink2:#b0b6dc;--ink3:#7f86b0;
--br:#8fa0ff;--br2:#a6b3ff;--brt:#0e1124;--br50:#1e2550;--br100:#2b3466;--ring:rgba(143,160,255,.3);
--ok:#58c995;--okb:#143427;--wn:#e8b54e;--wnb:#3a2d10;--er:#ff7d92;--erb:#411a24;
--in:#86adff;--inb:#17284d;--vi:#b79cff;--vib:#2b1f4f;--side:#0a0d1e;--sideink:#eceefb;--sidemu:#8890bd}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:400;letter-spacing:-.005em}
h4{margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
input,select,textarea{font:inherit;color:var(--ink);width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);outline:none;transition:border-color .15s,box-shadow .15s}
input[type=search]{-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--br);box-shadow:0 0 0 3px var(--ring)}
button:focus-visible{outline:2px solid var(--br);outline-offset:2px}
textarea{resize:vertical}
.mu{color:var(--ink3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none}

/* woven check — the Kota Doriya square-weave motif, used once on the hero panels */
.weave{background-image:linear-gradient(rgba(255,255,255,.11) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(255,255,255,.11) 1.5px,transparent 1.5px),linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:36px 36px,36px 36px,9px 9px,9px 9px}

/* layout shell */
.shell{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--sideink);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:12px;align-items:center;padding:2px 8px 22px}
.brand b{display:block;font:400 18px/1.15 var(--serif)}
.brand small{display:block;color:var(--sidemu);font-size:12.5px}
.mark{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:34px;height:34px;flex:none}
.mark i{display:block;border-radius:3px}
.mark i:nth-child(1){background:#8fa0ff}.mark i:nth-child(2){background:#ff6b86}.mark i:nth-child(3){background:#f2b640}.mark i:nth-child(4){background:#fff}
.side nav{display:flex;flex-direction:column;gap:3px;flex:1}
.side nav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;background:transparent;border-radius:10px;color:var(--sidemu);font-weight:600;text-align:left;transition:background .15s,color .15s}
.side nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.side nav button.on{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 3px 0 0 #ff6b86}
.side button:focus-visible{outline-color:#fff}
.sfoot{border-top:1px solid rgba(255,255,255,.14);padding-top:14px;display:grid;gap:12px}
.me{display:flex;gap:10px;align-items:center;padding:0 6px;min-width:0}
.av{width:34px;height:34px;border-radius:50%;background:#d8defa;color:#1a2150;display:grid;place-items:center;font-weight:700;flex:none}
.me div{min-width:0}
.me b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me small{display:block;color:var(--sidemu);text-transform:capitalize;font-size:12.5px}
.srow{display:flex;gap:6px}
.sbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:9px;border:1px solid rgba(255,255,255,.18);background:transparent;border-radius:10px;color:var(--sideink);font-size:13.5px;font-weight:600}
.sbtn:hover{background:rgba(255,255,255,.09)}
.col{min-width:0}
.page{max-width:1100px;margin:0 auto;padding:30px 30px 70px}
.mtop,.scrim{display:none}

/* page header */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph h1{font-size:30px;line-height:1.15}
.ph p{margin-top:6px;color:var(--ink2);max-width:62ch}
.pha{display:flex;gap:8px;flex-wrap:wrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);font-weight:600;font-size:14.5px;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--ink3)}
.btn-pri{background:var(--br);border-color:var(--br);color:var(--brt)}
.btn-pri:hover{background:var(--br2);border-color:var(--br2)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn-ghost:hover{background:var(--sf2);border-color:transparent}
.btn-dng{color:var(--er)}
.btn-light{background:#fff;border-color:#fff;color:#1a2150}
.btn-light:hover{background:#eef0fb;border-color:#eef0fb}
.btn.sm{padding:6px 11px;font-size:13.5px}
.btn.big{padding:12px 18px;font-size:15.5px;width:100%}
.ib{width:36px;height:36px;display:inline-grid;place-items:center;border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:0;color:var(--ink2);flex:none}
.ib:hover{color:var(--br);border-color:var(--br)}

/* segmented dashboard tabs */
.seg{display:inline-flex;gap:4px;padding:4px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;margin-bottom:22px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:9px 18px;border-radius:9px;font-weight:600;color:var(--ink2);white-space:nowrap}
.seg button.on{background:var(--br);color:var(--brt)}

/* dashboard */
.hero{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:30px 32px;border-radius:var(--r);color:#fff;margin-bottom:18px;background-color:#1f2870}
.hero h2{font-size:30px;line-height:1.15;display:flex;align-items:center;gap:14px}
.hero p{margin-top:8px;color:rgba(255,255,255,.84);max-width:50ch}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:#58d6a0}
.dot.late{background:#ff6b86;box-shadow:0 0 0 5px rgba(255,107,134,.28)}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));border:1px solid var(--ln);border-radius:var(--r);background:var(--sf);margin-bottom:24px;overflow:hidden}
.sti{padding:20px 24px;border-right:1px solid var(--ln)}
.sti:last-child{border-right:0}
.stl{font-weight:600;color:var(--ink2);font-size:14px}
.stv{font:400 38px/1.15 var(--serif);margin:4px 0;font-variant-numeric:tabular-nums}
.sth{font-size:13px;color:var(--ink3)}
.sti.late .stv{color:var(--er)}
.sec{margin-bottom:26px}
.sec>h2,.sh2{font-size:19px;margin-bottom:12px}
.grps{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;margin-bottom:14px}
.grp{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:20px 22px}
.grp h2{font-size:19px}
.grp>p{color:var(--ink3);font-size:13px;margin:3px 0 10px}
.lr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--ln)}
.lr b{display:block;font-weight:600}
.lr small{display:block;color:var(--ink3);font-size:12.5px}
.lv{font:400 26px/1 var(--serif);font-variant-numeric:tabular-nums}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r)}
.pad{padding:20px 22px}
.pad>h2,.pad>h3{margin-bottom:4px}
.pad>.mu{font-size:13.5px;margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:minmax(90px,180px) 1fr 46px;gap:12px;align-items:center;font-size:14px}
.bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.bar i{display:block;height:10px;background:var(--br50);border-radius:99px;overflow:hidden}
.bar u{display:block;height:100%;background:var(--br);border-radius:99px;text-decoration:none}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--ln)}
.li b{display:block}
.li small{display:block;color:var(--ink3);font-size:12.5px}

/* tables */
.tcard{overflow:hidden}
.tools{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--ln);flex-wrap:wrap}
.search{position:relative;flex:1;min-width:200px;max-width:380px;display:block}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink3);pointer-events:none}
.search input{padding-left:38px}
.count{color:var(--ink3);font-size:13.5px}
.w{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{padding:11px 16px;text-align:left;font-size:13px;font-weight:600;color:var(--ink3);background:var(--sf2);border-bottom:1px solid var(--ln);white-space:nowrap}
td{padding:13px 16px;border-bottom:1px solid var(--ln);white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
td.wrap{white-space:normal;min-width:220px}
tbody tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover{background:var(--br50)}
td[data-p]{font-weight:600}
td.act,th:last-child{width:1%}
td.act{text-align:right}
.pn{cursor:zoom-in;text-decoration:underline dotted;text-underline-offset:4px}
.th{width:40px;height:40px;object-fit:cover;border-radius:8px;border:1px solid var(--ln);vertical-align:middle}
.empty{padding:56px 20px;text-align:center;color:var(--ink3)}
.eico{width:56px;height:56px;border-radius:16px;background:var(--br50);color:var(--br);display:grid;place-items:center;margin:0 auto 14px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:3px}

/* chips */
.b{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--br50);color:var(--br);white-space:nowrap}
.b.ok,.b.s4{background:var(--okb);color:var(--ok)}
.b.s0{background:var(--wnb);color:var(--wn)}
.b.s1,.b.s2{background:var(--inb);color:var(--in)}
.b.s3{background:var(--vib);color:var(--vi)}
.b.s5{background:var(--erb);color:var(--er)}
.b.mu{background:var(--sf2);color:var(--ink3);border:1px solid var(--ln)}

/* dialogs */
dialog{border:0;padding:0;background:var(--sf);color:var(--ink);border-radius:18px;width:min(640px,94vw);max-height:90vh;box-shadow:0 24px 70px rgba(10,12,30,.45)}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(10,12,30,.55)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--ln)}
.dh h3{font-size:21px}
.db{padding:18px 20px;overflow-y:auto}
.df{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--ln);flex-wrap:wrap;background:var(--sf2);border-radius:0 0 18px 18px}
.df .sp{margin-right:auto}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld label{display:block;font-size:13.5px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.full{grid-column:1/-1}
.hint{display:block;color:var(--ink3);font-size:13px;margin-top:6px}
.meta{font-size:13px;color:var(--ink3);margin-top:14px}
.sub{font-size:15px;font-weight:700;margin:20px 0 10px}
.pv{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.pv img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--ln)}
.big{max-width:100%;max-height:60vh;display:block;margin:0 auto;border-radius:10px}
.itemcard{border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--sf2)}
.ih{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.totl{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-radius:12px;background:var(--br50);color:var(--br);font-weight:700;margin-top:14px}
.totl span:last-child{font:400 22px/1 var(--serif)}

/* settings */
.set{display:grid;gap:14px;max-width:640px}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* sign-in */
.auth{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.aside{background-color:#1a2150;color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;gap:36px}
.aside .brand{padding:0}
.aside .brand small{color:rgba(255,255,255,.7)}
.aside h1{font-size:46px;line-height:1.08;max-width:13ch}
.aside p{color:rgba(255,255,255,.82);max-width:38ch;font-size:16.5px;margin-top:16px}
.aside ul{list-style:none;padding:0;margin:0;display:grid;gap:12px;color:rgba(255,255,255,.92)}
.aside li{display:flex;gap:10px;align-items:center}
.aside li .ic{color:#58d6a0}
.formside{display:grid;place-items:center;padding:32px}
.fcard{width:min(400px,100%);display:grid;gap:16px}
.fcard h2{font-size:30px}
.er{color:var(--er);min-height:1.3em;font-size:14px}
.load{min-height:70vh;display:grid;place-items:center;color:var(--ink3);text-align:center;padding:24px}
.msg{max-width:420px;display:grid;gap:12px;justify-items:center}
.msg h2{color:var(--ink);font-size:24px}
.spin{width:30px;height:30px;border:3px solid var(--br100);border-top-color:var(--br);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}

#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:100;max-width:90vw}
#toast.on{opacity:1}

/* tablets and phones: sidebar becomes a slide-in menu */
@media(max-width:900px){
.shell{display:block}
.side{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:40;transform:translateX(-104%);transition:transform .22s ease;box-shadow:0 0 50px rgba(0,0,0,.45)}
.shell.nav-open .side{transform:none}
.scrim{display:block;position:fixed;inset:0;background:rgba(10,12,30,.55);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.shell.nav-open .scrim{opacity:1;pointer-events:auto}
.mtop{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:var(--sf);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:20}
.mtop b{font:400 18px var(--serif)}
.page{padding:20px 14px 60px}
.ph h1{font-size:26px}
.two{grid-template-columns:1fr}
.auth{grid-template-columns:1fr}
.aside{padding:28px;gap:20px}
.aside h1{font-size:32px}
.aside ul{display:none}
}
/* phones: tables turn into readable cards, dialogs into bottom sheets */
@media(max-width:720px){
.hero{padding:22px}
.hero h2{font-size:24px}
.sti{border-right:0;border-bottom:1px solid var(--ln)}
.sti:last-child{border-bottom:0}
.fg{grid-template-columns:1fr}
.bar{grid-template-columns:minmax(70px,110px) 1fr 40px}
.rt thead{display:none}
.rt,.rt tbody{display:block}
.rt tr{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-bottom:1px solid var(--ln)}
.rt tbody tr:last-child{border-bottom:0}
.rt td{display:flex;justify-content:space-between;gap:16px;padding:3px 0;border:0;white-space:normal;max-width:none;text-align:right;overflow:visible}
.rt td::before{content:attr(data-label);color:var(--ink3);font-size:13px;text-align:left;flex:none}
.rt td[data-p]{order:-1;font-size:16.5px;text-align:left;justify-content:flex-start;margin-bottom:4px}
.rt td[data-p]::before,.rt td.act::before{display:none}
.rt td:empty{display:none}
.rt td.wrap{min-width:0}
.rt td.act{justify-content:flex-end;padding-top:8px}
dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:18px 18px 0 0;max-height:92vh}
.df{border-radius:0}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>

/* ---------- storage (Supabase table "kv") ---------- */
async function load(k){const{data,error}=await sb.from('kv').select('j').eq('k',k).maybeSingle();if(error)throw error;return data?JSON.parse(data.j):null}
async function save(k,o){const{error}=await sb.from('kv').upsert({k,j:JSON.stringify(o)});toast(error?'Could not save: '+error.message:'Saved')}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2400)}
const persist=()=>save('data',D);
async function mut(fn){try{const L=await load('data');if(L)D=L}catch(e){}fn();await persist()} // re-read latest so two staff saving at once don't overwrite each other

 try{D=await load('data');if(!D){D=seed();await save('data',D)}else if(migrateAsg())await save('data',D)}

/* ---------- dashboard ---------- */
function dash(){
 const sm=(a,k)=>a.reduce((t,r)=>t+(+r[k]||0),0),tin=sm(D.reg,'in'),tout=sm(D.reg,'out'),
 open=D.del.filter(r=>!['Delivered','Returned'].includes(r.status)),od=open.filter(isOver),by={};
 D.reg.forEach(r=>by[r.name]=(by[r.name]||0)+(+r.in||0)-(+r.out||0));
 const top=Object.entries(by).filter(([,v])=>v!==0).sort((a,b)=>b[1]-a[1]).slice(0,8),mx=Math.max(1,...top.map(t=>t[1])),
 asgIt=D.asg.flatMap(r=>r.items||[]),val=asgIt.reduce((t,it)=>t+(+it.qty||0)*pr(it.name),0),
 bar=(l,v,m2)=>`<div class="bar"><span title="${esc(l)}">${esc(l)}</span><i><u style="width:${Math.max(0,v)/m2*100}%"></u></i><b>${v}</b></div>`,
 sti=(l,v,h,tone)=>`<div class="sti${tone?' '+tone:''}"><div class="stl">${l}</div><div class="stv">${v}</div><div class="sth">${h}</div></div>`,
 grp=(t,d,rows)=>`<section class="grp"><h2>${t}</h2><p>${d}</p>${rows.map(([l,v,h])=>`<div class="lr"><div><b>${l}</b>${h?`<small>${h}</small>`:''}</div><span class="lv">${v}</span></div>`).join('')}</section>`;
 let holdS=0,holdU=0,packedQ=0,unpackedQ=0,stitchUnit=0;
 D.reg.forEach(r=>{const net=(+r.in||0)-(+r.out||0);
  if(r.stitch==='Unstitched')holdU+=net;else holdS+=net;
  if(net>0){if(r.status==='Packed')packedQ+=net;else unpackedQ+=net}
  const to=(r.to||'').trim().toLowerCase(),from=(r.from||'').trim().toLowerCase();
  if(to==='stitching unit')stitchUnit+=(+r.out||0);
  if(from==='stitching unit')stitchUnit-=(+r.in||0)});
 const nm=(me.name||'').split(/[ @]/)[0],
 head=`<div class="ph"><div><h1>Hello, ${esc(nm.charAt(0).toUpperCase()+nm.slice(1))}</h1><p>${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p></div></div>`,
 seg=`<div class="seg" role="tablist">${[['overview','Overview'],['stock','Stock & holding'],['del','Deliveries']].map(([k,l])=>`<button role="tab" aria-selected="${dashTab===k}" class="${dashTab===k?'on':''}" onclick="dashTab='${k}';draw()">${l}</button>`).join('')}</div>`,
 strip=`<div class="strip">${sti('Open deliveries',open.length,'Not yet delivered or returned')}${sti('Overdue',od.length,'25 or more days since dispatch',od.length?'late':'')}${sti('Assigned value','Rs. '+inr(val),'Value of all customer assignments')}</div>`;

 if(dashTab==='stock')return head+seg+`<div class="grps">${grp('Holding','Pieces you have in hand. Qty in minus Qty out.',[['Stitched holding',holdS],['Unstitched holding',holdU],['Stitching unit holding',stitchUnit,'Sent there and not yet received back']])}${grp('Packing','Only pieces still in holding.',[['Packed',packedQ],['Unpacked',unpackedQ]])}${grp('Catalogue and movement','Across all stock entries.',[['Designs in catalogue',D.stock.length],['Pieces received',tin,'Total Qty in'],['Pieces sent out',tout,'Total Qty out']])}</div>
<section class="card pad"><h2>Holding by design</h2><p class="mu">The 8 designs with the most pieces in holding.</p>${top.length?`<div class="bars">${top.map(t=>bar(t[0],t[1],mx)).join('')}</div>`:'<div class="empty"><b>Nothing in holding</b><p>Add stock entries to see them here.</p></div>'}</section>`;

 if(dashTab==='del')return head+seg+strip+`<div class="two">${grp('Parcels by status','All parcels in Deliveries.',DS.map((s,i)=>[`<span class="b s${i}">${s}</span>`,D.del.filter(r=>r.status===s).length]))}
<section class="grp"><h2>Overdue deliveries</h2><p>Dispatched 25 or more days ago and not yet delivered.</p>${od.length?od.map(r=>`<div class="li"><div><b>${esc(r.cust)}</b><small>Dispatched ${fd(r.disp)}, ${daysSince(r.disp)} days ago</small></div><span class="b s${DS.indexOf(r.status)}">${esc(r.status)}</span></div>`).join(''):'<div class="li"><div><b>Nothing is overdue</b><small>Every parcel is within 25 days of dispatch.</small></div></div>'}</section></div>`;

 return head+seg+`<div class="hero weave"><div><h2><span class="dot${od.length?' late':''}"></span>${od.length?`${od.length} ${od.length===1?'delivery is':'deliveries are'} overdue`:'All deliveries are on time'}</h2><p>${od.length?'These parcels were dispatched 25 or more days ago and have not been delivered.':open.length?`${open.length} ${open.length===1?'parcel is':'parcels are'} on the way.`:'No parcels are waiting right now.'}</p></div>${od.length?`<button class="btn btn-light" onclick="dashTab='del';draw()">See overdue deliveries</button>`:''}</div>
${strip}<div class="sec"><h2>Quick add</h2><div class="pha"><button class="btn" onclick="edit('reg')">${ic('plus',16)}<span>Stock entry</span></button><button class="btn" onclick="asgEdit()">${ic('plus',16)}<span>Assignment</span></button><button class="btn" onclick="edit('del')">${ic('plus',16)}<span>Delivery</span></button></div></div>`}

/* ---------- lists ---------- */
const cnt=()=>`${shown} ${shown===1?'record':'records'}`;
function refresh(m){$('#tb').innerHTML=tbl(m);$('#cnt').textContent=cnt()}
function empty(m,has){const e=has?['No matches','Try a different word.']:M[m].e;return `<div class="empty"><div class="eico">${ic('inbox',26)}</div><b>${e[0]}</b><p>${e[1]}</p></div>`}
function list(m){const c=M[m],t=tbl(m);
 return `<div class="ph"><div><h1>${c.t}</h1><p>${c.d}</p></div><div class="pha"><button class="btn" onclick="csv('${m}')">${ic('download',16)}<span>Export CSV</span></button><button class="btn btn-pri" onclick="${m==='asg'?'asgEdit()':`edit('${m}')`}">${ic('plus',16)}<span>Add ${c.s}</span></button></div></div>
<div class="card tcard"><div class="tools"><label class="search">${ic('search',16)}<input id="q" type="search" placeholder="Search ${c.t.toLowerCase()}" value="${esc(Q[m]||'')}" oninput="Q['${m}']=this.value;refresh('${m}')" aria-label="Search ${c.t.toLowerCase()}"></label><span class="count" id="cnt">${cnt()}</span></div><div class="w" id="tb">${t}</div></div>`}
function tbl(m){if(m==='asg')return asgTbl();
 const c=M[m],q=(Q[m]||'').toLowerCase(),hasD=c.f[0][2]==='date',prim={stock:'name',reg:'name',del:'cust'}[m],
 rows=D[m].filter(r=>!q||[...c.f.map(f=>r[f[0]]),r.by].join(' ').toLowerCase().includes(q)).sort((a,b)=>hasD?((b.date||'')<(a.date||'')?-1:1):String(a.name).localeCompare(b.name));
 shown=rows.length;
 if(!rows.length)return empty(m,D[m].length);
 const td=(k,l,t,r)=>{const a=`data-label="${l}"${k===prim?' data-p':''}`;
  if(k==='status')return m==='del'?`<td ${a}>${r[k]?`<span class="b s${DS.indexOf(r[k])}">${esc(r[k])}</span>`:''}</td>`:`<td ${a}>${r[k]==='Packed'?'<span class="b ok">Packed</span>':'<span class="b mu">Unpacked</span>'}</td>`;
  if(t==='image')return `<td ${a}>${r[k]?`<img class="th" src="${esc(r[k])}" alt="">`:'<span class="mu">No photo</span>'}</td>`;
  if(m==='stock'&&k==='name')return `<td ${a}><span class="pn" onclick="event.stopPropagation();showImgFor('${r.id}')">${esc(r[k])}</span></td>`;
  if(t==='date')return `<td ${a}>${fd(r[k])}</td>`;
  if(k==='price')return `<td ${a}>${r[k]===''||r[k]==null?'':'Rs. '+inr(r[k])}</td>`;
  return `<td ${a}>${esc(r[k])}</td>`};
 return `<table class="rt"><thead><tr>${c.f.map(f=>`<th>${f[1]}</th>`).join('')}${c.x?`<th>${c.x[0]}</th>`:''}<th><span class="sr">Edit</span></th></tr></thead><tbody>${rows.map(r=>{
  const click=m==='stock'?`ondblclick="edit('${m}','${r.id}')"`:`onclick="edit('${m}','${r.id}')"`,
  xv=c.x?c.x[1](r):'',
  xcell=c.x?`<td data-label="${c.x[0]}">${xv===''?'':m==='reg'?`<b>${xv}</b>`:xv}</td>`:'';
  return `<tr ${click}>${c.f.map(([k,l,t])=>td(k,l,t,r)).join('')}${xcell}<td class="act"><button class="ib" title="Edit" aria-label="Edit" onclick="event.stopPropagation();edit('${m}','${r.id}')">${ic('pencil',16)}</button></td></tr>`}).join('')}</tbody></table>`}

const dlgHead=t=>`<div class="dh"><h3>${t}</h3><button class="ib" onclick="$('#dlg').close()" aria-label="Close">${ic('x',18)}</button></div>`;
function fieldHTML(k,l,t,dl,r){
 if(t==='image')return `<div class="fld full" id="imgwrap" data-rm="0"><label for="f_${k}">${l}</label>${r[k]?`<div class="pv" id="imgprev"><img src="${esc(r[k])}" alt=""><button type="button" class="btn btn-ghost btn-dng sm" onclick="$('#imgwrap').dataset.rm='1';$('#imgprev').remove()">Remove photo</button></div>`:''}<input id="f_${k}" type="file" accept="image/*"><span class="hint">Optional. Upload a photo of the design if you have one.</span></div>`;
 const full=(t==='textarea'||k==='ref'||k==='addr')?' full':'';let inner;
 if(t==='select'){const o=Array.isArray(dl)?dl:DS;inner=`<select id="f_${k}">${o.map(v=>`<option value="${esc(v)}"${v===(r[k]||'')?' selected':''}>${v===''?'Unpacked':esc(v)}</option>`).join('')}</select>`}
 else if(t==='textarea')inner=`<textarea id="f_${k}" rows="2">${esc(r[k])}</textarea>`;
 else inner=`<input id="f_${k}" type="${t}" value="${esc(r[k])}"${dl&&!Array.isArray(dl)?` list="${dl}"`:''}>`;
 return `<div class="fld${full}"><label for="f_${k}">${l}</label>${inner}</div>`}
function edit(m,id){const c=M[m],r=id?D[m].find(x=>x.id===id):{date:today(),in:m==='reg'?1:'',status:m==='del'?'Pending':'',coll:m==='stock'?'KOTA DORIYA':''};
 $('#dlg').innerHTML=`${dlgHead((id?'Edit ':'Add ')+c.s)}<div class="db"><div class="fg">${c.f.map(([k,l,t,dl])=>fieldHTML(k,l,t,dl,r)).join('')}</div>${r.by?`<p class="meta">Last saved by ${esc(r.by)} on ${fd(r.at)}</p>`:''}</div><div class="df">${id?'<button class="btn btn-ghost btn-dng sp" id="dx">Delete</button>':''}<button class="btn" onclick="$(\'#dlg\').close()">Cancel</button><button class="btn btn-pri" onclick="sv(\'${m}\',\'${id||''}\')">${id?'Save changes':'Add '+c.s}</button></div>`;
 if($('#dx'))$('#dx').onclick=async e=>{if(!e.currentTarget.dataset.c){e.currentTarget.dataset.c=1;e.currentTarget.textContent='Click again to delete';return}
  await mut(()=>{D[m]=D[m].filter(x=>x.id!==id)});$('#dlg').close();draw()};
 $('#dlg').showModal()}
async function uploadImage(file){const path='stock/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+(file.name.split('.').pop()||'jpg');
 const{error}=await sb.storage.from('images').upload(path,file,{upsert:false});if(error)throw error;
 const{data}=sb.storage.from('images').getPublicUrl(path);return data.publicUrl}
async function sv(m,id){const c=M[m],v={};
 for(const [k,,t] of c.f){if(t==='image')continue;const x=$('#f_'+k).value.trim();v[k]=t==='number'?(x===''?'':+x):x}
 if(!(v.name||v.cust))return toast('Please fill in the name');
 const imgF=c.f.find(f=>f[2]==='image');
 if(imgF){const fld=imgF[0],cur0=id?((D[m].find(x=>x.id===id)||{})[fld]||''):'',wrap=$('#imgwrap'),fi=$('#f_'+fld);
  if(wrap&&wrap.dataset.rm==='1')v[fld]='';
  else if(fi&&fi.files&&fi.files[0]){try{toast('Uploading photo…');v[fld]=await uploadImage(fi.files[0])}catch(e){toast('Photo upload failed, saved without it');v[fld]=cur0}}
  else v[fld]=cur0}
 v.by=me.name;v.at=today();
 await mut(()=>{const r=id&&D[m].find(x=>x.id===id);if(r)Object.assign(r,v);else D[m].push({id:id||uid(),...v})});
 $('#dlg').close();draw()}
function showImgFor(id){const r=D.stock.find(x=>x.id===id);if(!r)return;if(!r.image){toast('No photo yet. Use Edit to add one.');return}
 $('#dlg').innerHTML=`${dlgHead(esc(r.name))}<div class="db"><img class="big" src="${esc(r.image)}" alt="${esc(r.name)}"></div><div class="df"><button class="btn btn-pri" onclick="$('#dlg').close()">Close</button></div>`;
 $('#dlg').showModal()}

/* ---------- assignments: one customer, several items ---------- */
function asgTotal(items){return items.reduce((t,it)=>t+(+it.qty||0)*pr(it.name),0)}
function asgTbl(){const q=(Q.asg||'').toLowerCase();
 let rows=D.asg.filter(r=>!q||(r.cust+' '+r.date+' '+(r.by||'')+' '+(r.items||[]).map(it=>it.name+' '+it.stitch+' '+it.size+' '+it.notes).join(' ')).toLowerCase().includes(q));
 rows=[...rows].sort((a,b)=>(b.date||'')<(a.date||'')?-1:1);shown=rows.length;
 if(!rows.length)return empty('asg',D.asg.length);
 return `<table class="rt"><thead><tr><th>Date</th><th>Customer</th><th>Items</th><th>Qty</th><th>Amount (Rs.)</th><th><span class="sr">Edit</span></th></tr></thead><tbody>${rows.map(r=>{const items=r.items||[],qty=items.reduce((t,it)=>t+(+it.qty||0),0),summary=items.map(it=>`${esc(it.name)}${it.size?' ('+esc(it.size)+')':''} ×${it.qty}`).join(', ');
  return `<tr onclick="asgEdit('${r.id}')"><td data-label="Date">${fd(r.date)}</td><td data-label="Customer" data-p>${esc(r.cust)}</td><td data-label="Items" class="wrap">${summary}</td><td data-label="Qty">${qty}</td><td data-label="Amount (Rs.)"><b>${inr(asgTotal(items))}</b></td><td class="act"><button class="ib" title="Edit" aria-label="Edit" onclick="event.stopPropagation();asgEdit('${r.id}')">${ic('pencil',16)}</button></td></tr>`}).join('')}</tbody></table>`}
let draftItems=[];
const blankItem=()=>({name:'',stitch:'',size:'',qty:1,notes:''});
function asgEdit(id){const r=id?D.asg.find(x=>x.id===id):{date:today(),cust:''};
 draftItems=id?r.items.map(x=>({...x})):[blankItem()];
 $('#dlg').innerHTML=asgForm(r,id);
 if($('#adx'))$('#adx').onclick=async e=>{if(!e.currentTarget.dataset.c){e.currentTarget.dataset.c=1;e.currentTarget.textContent='Click again to delete';return}
  await mut(()=>{D.asg=D.asg.filter(x=>x.id!==id)});$('#dlg').close();draw()};
 $('#dlg').showModal()}
function itemRow(it,i){return `<div class="itemcard"><div class="ih"><b>Item ${i+1}</b><button type="button" class="btn btn-ghost btn-dng sm" onclick="rmItem(${i})">Remove</button></div><div class="fg"><div class="fld"><label>Stock name</label><input value="${esc(it.name)}" list="stocks" oninput="draftItems[${i}].name=this.value;updTotal()"></div><div class="fld"><label>Stitch type</label><input value="${esc(it.stitch)}" list="stitch" oninput="draftItems[${i}].stitch=this.value"></div><div class="fld"><label>Size</label><input value="${esc(it.size)}" list="sizes" oninput="draftItems[${i}].size=this.value"></div><div class="fld"><label>Qty</label><input type="number" min="1" value="${it.qty}" oninput="draftItems[${i}].qty=+this.value||0;updTotal()"></div><div class="fld full"><label>Notes</label><input value="${esc(it.notes)}" oninput="draftItems[${i}].notes=this.value"></div></div></div>`}
function asgForm(r,id){return `${dlgHead((id?'Edit ':'Add ')+'assignment')}<div class="db"><div class="fg"><div class="fld"><label for="af_date">Date</label><input id="af_date" type="date" value="${esc(r.date||today())}"></div><div class="fld"><label for="af_cust">Customer name</label><input id="af_cust" value="${esc(r.cust||'')}" autocomplete="off"></div></div>
<h4 class="sub">Items</h4><div id="items">${draftItems.map((it,i)=>itemRow(it,i)).join('')}</div>
<button type="button" class="btn" onclick="addItem()">${ic('plus',16)}<span>Add another item</span></button>
<div class="totl"><span>Total</span><span id="asgTotalLine">Rs. ${inr(asgTotal(draftItems))}</span></div>
${r.by?`<p class="meta">Last saved by ${esc(r.by)} on ${fd(r.at)}</p>`:''}</div>
<div class="df">${id?'<button class="btn btn-ghost btn-dng sp" id="adx">Delete</button>':''}<button class="btn" onclick="$(\'#dlg\').close()">Cancel</button><button class="btn btn-pri" onclick="asgSave(\'${id||''}\')">${id?'Save changes':'Add assignment'}</button></div>`}
function addItem(){draftItems.push(blankItem());refreshItems()}
function rmItem(i){draftItems.splice(i,1);if(!draftItems.length)draftItems.push(blankItem());refreshItems()}
function refreshItems(){$('#items').innerHTML=draftItems.map((it,i)=>itemRow(it,i)).join('');updTotal()}
function updTotal(){const t=$('#asgTotalLine');if(t)t.textContent='Rs. '+inr(asgTotal(draftItems))}
async function asgSave(id){const date=$('#af_date').value,cust=$('#af_cust').value.trim();
 if(!cust)return toast('Please enter the customer name');
 const items=draftItems.filter(it=>it.name.trim());
 if(!items.length)return toast('Add at least one item');
 const v={date,cust,items,by:me.name,at:today()};
 await mut(()=>{const r=id&&D.asg.find(x=>x.id===id);if(r)Object.assign(r,v);else D.asg.push({id:id||uid(),...v})});
 $('#dlg').close();draw()}

/* ---------- settings, export, backup ---------- */
function sett(){return `<div class="ph"><div><h1>Settings</h1><p>Your account and your data.</p></div></div><div class="set">
<div class="card pad"><h3>Account</h3><p class="mu">Signed in as <b>${esc(me.name)}</b> (${me.role}).</p></div>
<div class="card pad"><h3>Change my password</h3><p class="mu">Use at least 6 characters.</p><div class="fld"><label for="np">New password</label><input id="np" type="password" autocomplete="new-password"></div><div style="margin-top:14px"><button class="btn btn-pri" onclick="chpw()">Update password</button></div></div>
${me.role==='admin'?`<div class="card pad"><h3>Backup and restore</h3><p class="mu">Your data is saved online and stays when you log out. Download a copy now and then to be safe.</p><div class="row"><button class="btn" onclick="backup()">${ic('download',16)}<span>Download backup</span></button><button class="btn" onclick="$('#rf').click()">Restore from backup</button><input id="rf" type="file" accept=".json" hidden onchange="restore(this)"></div></div>`:''}</div>`}
function dl(name,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e3)}
function csv(m){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 if(m==='asg'){const rows=[['Date','Customer Name','Stock Name','Stitch Type','Size','Qty','Notes','Amount (Rs.)']];D.asg.forEach(r=>(r.items||[]).forEach(it=>rows.push([r.date,r.cust,it.name,it.stitch,it.size,it.qty,it.notes,(+it.qty||0)*pr(it.name)])));return dl('asg.csv',rows.map(r=>r.map(q).join(',')).join('\n'))}
 const c=M[m],fs=c.f.filter(f=>f[2]!=='image');dl(m+'.csv',[fs.map(f=>f[1]),...D[m].map(r=>fs.map(f=>r[f[0]]))].map(r=>r.map(q).join(',')).join('\n'))}
const backup=()=>dl('rifahs-backup-'+today()+'.json',JSON.stringify(D,null,1));
function restore(i){const f=i.files[0];if(!f)return;const rd=new FileReader();rd.onload=async()=>{try{const o=JSON.parse(rd.result);if(!['stock','reg','asg','del'].every(k=>Array.isArray(o[k])))throw 0;D=o;migrateAsg();await persist();toast('Backup restored');draw()}catch(e){toast('That file is not a valid backup')}};rd.readAsText(f)}
async function chpw(){const p=$('#np').value;if(p.length<6)return toast('Use at least 6 characters');const{error}=await sb.auth.updateUser({password:p});toast(error?error.message:'Password updated');$('#np').value=''}

/* ---------- start ---------- */
(async function boot(){
 $('#app').innerHTML='<div class="load"><div><div class="spin"></div>Loading…</div></div>';
 try{if(!window.supabase||SB.url.startsWith('PASTE'))throw 0;
  sb=supabase.createClient(SB.url,SB.key);
  const{data:{session}}=await sb.auth.getSession();session?await start(session.user):loginView();
  document.addEventListener('visibilitychange',async()=>{if(document.hidden||!me||$('#dlg').open)return;try{D=await load('data');draw()}catch(e){}})
 }catch(e){$('#app').innerHTML='<div class="load"><div class="msg"><h2>Setup needed</h2><p>Open index.html and paste your Supabase URL and anon key at the top of the script. See README.md.</p></div></div>'}
})();
</script></body></html>
